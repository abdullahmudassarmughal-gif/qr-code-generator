<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QR Code Generator</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,Helvetica,sans-serif;
}

body{
background:linear-gradient(135deg,#4facfe,#00f2fe);
display:flex;
justify-content:center;
align-items:center;
min-height:100vh;
padding:20px;
}

.container{
background:white;
padding:35px;
border-radius:20px;
width:420px;
max-width:100%;
box-shadow:0 10px 30px rgba(0,0,0,.2);
text-align:center;
}

h1{
margin-bottom:20px;
color:#333;
}

input{
width:100%;
padding:15px;
font-size:17px;
border:2px solid #ddd;
border-radius:10px;
margin-bottom:20px;
outline:none;
}

input:focus{
border-color:#007BFF;
}

button{
width:100%;
padding:15px;
font-size:18px;
background:#007BFF;
color:white;
border:none;
border-radius:10px;
cursor:pointer;
margin-bottom:15px;
}

button:hover{
background:#0056b3;
}

#qrcode{
display:flex;
justify-content:center;
margin-top:20px;
}

#downloadBtn{
display:none;
}

</style>

</head>

<body>

<div class="container">

<h1>QR Code Generator</h1>

<input
id="text"
type="text"
placeholder="Enter website or text">

<button onclick="generateQR()">
Generate QR Code
</button>

<div id="qrcode"></div>

<button id="downloadBtn" onclick="downloadQR()">
Download QR Code
</button>

</div>

<script>

let qr;

function generateQR(){

const text=document.getElementById("text").value;

if(text===""){
alert("Please enter something.");
return;
}

document.getElementById("qrcode").innerHTML="";

qr=new QRCode(document.getElementById("qrcode"),{
text:text,
width:250,
height:250
});

setTimeout(()=>{
document.getElementById("downloadBtn").style.display="block";
},300);

}

function downloadQR(){

const img=document.querySelector("#qrcode img");

if(img){

const link=document.createElement("a");

link.href=img.src;

link.download="QRCode.png";

link.click();

}

}

</script>

</body>
</html>
